<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC Activity Display</title>
<style>:root{--bg:#070b10;--card:#101923;--gold:#d6b35a;--text:#f3f6f8;--muted:#8ea0b2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#162331,#070b10 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;min-height:100vh}#app{min-height:100vh;padding:4vh 5vw}.center{min-height:90vh;display:flex;align-items:center;justify-content:center;text-align:center}.code{font-size:10vw;letter-spacing:1vw;color:var(--gold);font-weight:900}.muted{color:var(--muted)}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #26384a;padding-bottom:2vh}.head h1{font-size:4vw;margin:0}.pool{font-size:3vw;color:var(--gold);font-weight:900}.boss{display:grid;grid-template-columns:1.2fr .8fr;gap:3vw;margin-top:5vh}.bossname{font-size:5vw;font-weight:900}.hpnum{font-size:7vw;font-weight:900}.bar{height:5vh;border-radius:99px;background:#2a333d;overflow:hidden;margin-top:2vh}.fill{height:100%;background:linear-gradient(90deg,#a52f2f,#ef6666);transition:width .5s}.latest{background:var(--card);border:1px solid #26384a;border-radius:20px;padding:3vw;font-size:2.2vw}table{width:100%;border-collapse:collapse;margin-top:4vh;font-size:2.2vw}th,td{padding:1.4vh 1vw;border-bottom:1px solid #253443}th{color:var(--gold)}.rank{font-size:2.7vw;font-weight:900}</style></head><body><div id="app"></div><script>
const AK='epcDisplayApiUrlV1',DK='epcDisplayDeviceIdV1';let API=localStorage.getItem(AK)||'',deviceId=localStorage.getItem(DK)||'',code='',slide=0;
const money=n=>'$'+Math.round(+n||0).toLocaleString('zh-TW');
function setup(){if(!API){app.innerHTML='<div class="center"><div><h1>EPC 顯示器設定</h1><p>輸入 Display API URL</p><input id="api" style="width:min(800px,80vw);font-size:22px;padding:14px"><br><button style="font-size:22px;padding:12px 25px;margin-top:15px" onclick="saveApi()">開始配對</button></div></div>';return}reg()}
function saveApi(){API=document.getElementById('api').value.trim();if(API){localStorage.setItem(AK,API);reg()}}
async function call(p={},post=false){if(post){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p),redirect:'follow'});return r.json()}let u=API+(API.includes('?')?'&':'?')+new URLSearchParams(p);let r=await fetch(u,{cache:'no-store'});return r.json()}
async function reg(){if(!deviceId){deviceId='D'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem(DK,deviceId)}try{let r=await call({action:'register',deviceId},true);code=r.code||'';if(!r.paired)pair();poll()}catch(e){setTimeout(reg,5000)}}
function pair(){app.innerHTML=`<div class="center"><div><h1>EPC DISPLAY</h1><div class="muted">請到管理後台 → 顯示設備輸入配對碼</div><div class="code">${code||'------'}</div><div class="muted">配對後自動切換</div></div></div>`}
function table(p,weekly=false){let rs=p.rows||[];app.innerHTML=`<div class="head"><h1>${p.title}</h1><div class="muted">EPC POKER</div></div><table><thead><tr><th>排名</th><th>會員</th><th>${weekly?'參賽場次':'積分/券數'}</th>${weekly?'<th>簽到天數</th>':''}</tr></thead><tbody>${rs.map((r,i)=>`<tr><td class="rank">${i+1}</td><td>${r.name||''}</td><td>${weekly?r.games:(r.score??0)}</td>${weekly?`<td>${r.days||0}</td>`:''}</tr>`).join('')}</tbody></table>`}
function render(p){if(!p)return;if(p.type==='rotate'){let a=p.slides||[];if(a.length)render(a[(slide++)%a.length]);return}if(p.type==='boss'){let b=p.boss,h=b?Math.max(0,+b.hp||0):0,m=b?Math.max(1,+b.initialHp||1):1,pc=Math.max(0,Math.min(100,h/m*100));app.innerHTML=`<div class="head"><h1>雙十狩王</h1><div class="pool">目前獎池 ${money(p.pool)} / ${money(p.cap)}</div></div><div class="boss"><div><div class="muted">${p.attackActive?'狩王模式已啟動':'一般累積模式'}</div><div class="bossname">${b?b.name:'尚未建立魔王'}</div><div class="hpnum">${b?(b.killed?'DEFEATED':h+' HP'):'--'}</div><div class="bar"><div class="fill" style="width:${pc}%"></div></div></div><div class="latest"><div class="muted">最新攻擊</div>${p.latest?`<h2>${p.latest.member}</h2><div>${p.latest.method}｜傷害 ${p.latest.damage}</div><div>${p.latest.success?'擊殺成功！':''}</div>`:'尚無攻擊紀錄'}</div></div>`;return}table(p,p.type==='weekly')}
async function poll(){try{let r=await call({action:'state',deviceId});if(r.paired){render(r.payload)}else{code=r.code||code;pair()}}catch(e){}setTimeout(poll,3000)}
setup();</script></body></html>
